<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101019" />
    <title>Afterglow — Immersive Calculator</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap");

      :root {
        color-scheme: dark;
        font-family: "Manrope", "Arial", sans-serif;
        color: #f5f3ff;
        background: #101019;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --muted: #9290a6;
        --line: rgb(255 255 255 / 9%);
        --mono: "DM Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 78% 46%, rgb(92 65 173 / 15%), transparent 34%),
          radial-gradient(ellipse at 16% 92%, rgb(31 118 139 / 12%), transparent 35%),
          #101019;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 30rem;
        height: 30rem;
        border-radius: 50%;
        content: "";
        filter: blur(100px);
        opacity: 0.23;
        pointer-events: none;
      }

      body::before {
        top: -15rem;
        right: -7rem;
        background: #7756e8;
        animation: drift 18s ease-in-out infinite alternate;
      }

      body::after {
        bottom: -20rem;
        left: -10rem;
        background: #176f87;
        animation: drift 22s ease-in-out infinite alternate-reverse;
      }

      button {
        color: inherit;
        font: inherit;
      }

      .shell {
        width: min(1120px, calc(100% - 64px));
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 390px;
        align-items: center;
        gap: clamp(52px, 9vw, 130px);
        padding: 56px 0;
      }

      .intro {
        max-width: 520px;
        padding-bottom: 8px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 0 0 30px;
        color: #c7b8ff;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 28px;
        height: 1px;
        background: #a58aff;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(54px, 8vw, 94px);
        font-weight: 600;
        letter-spacing: -0.085em;
        line-height: 0.98;
      }

      h1 span {
        display: block;
        color: #a994ff;
      }

      .description {
        max-width: 360px;
        margin: 25px 0 0;
        color: #aaa8b9;
        font-size: 15px;
        line-height: 1.8;
      }

      .tip {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 45px;
        color: #8b899d;
        font-family: var(--mono);
        font-size: 11px;
      }

      .tip kbd {
        display: inline-grid;
        min-width: 26px;
        height: 26px;
        place-items: center;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgb(255 255 255 / 4%);
        color: #dedbea;
        font: inherit;
      }

      .calculator {
        position: relative;
        isolation: isolate;
        padding: 22px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 13%);
        border-radius: 28px;
        background: linear-gradient(145deg, rgb(35 34 50 / 94%), rgb(23 22 34 / 92%));
        box-shadow:
          0 35px 100px rgb(0 0 0 / 42%),
          inset 0 1px rgb(255 255 255 / 8%);
        backdrop-filter: blur(24px);
      }

      .calculator::before {
        position: absolute;
        z-index: -1;
        top: -100px;
        right: -100px;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        background: rgb(139 110 255 / 11%);
        content: "";
        filter: blur(50px);
        pointer-events: none;
      }

      .calculator-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 2px 2px 21px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #e3e0ee;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border: 1px solid rgb(189 169 255 / 35%);
        border-radius: 8px;
        background: rgb(156 129 255 / 14%);
        color: #c9baff;
        font-size: 15px;
      }

      .online {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #8f8da0;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .online::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #80deb1;
        box-shadow: 0 0 12px rgb(128 222 177 / 65%);
        content: "";
      }

      .screen {
        min-height: 155px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 17px 15px 13px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 7%);
        border-radius: 17px;
        background: linear-gradient(145deg, rgb(12 12 20 / 76%), rgb(20 19 31 / 84%));
        box-shadow: inset 0 2px 15px rgb(0 0 0 / 24%);
      }

      .screen-label {
        align-self: flex-start;
        color: #827f95;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .expression {
        width: 100%;
        min-height: 18px;
        overflow: hidden;
        color: #9992b3;
        font-family: var(--mono);
        font-size: 12px;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .display {
        width: 100%;
        overflow: hidden;
        color: #f8f6ff;
        font-family: var(--mono);
        font-size: clamp(37px, 7vw, 49px);
        font-weight: 400;
        letter-spacing: -0.075em;
        line-height: 1.1;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keys {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 9px;
      }

      .key {
        min-width: 0;
        height: 57px;
        border: 1px solid rgb(255 255 255 / 8%);
        border-radius: 14px;
        background: linear-gradient(145deg, rgb(255 255 255 / 8%), rgb(255 255 255 / 3%));
        color: #e9e6f2;
        cursor: pointer;
        font-size: 18px;
        font-weight: 600;
        transition:
          transform 120ms ease,
          border-color 160ms ease,
          background-color 160ms ease,
          box-shadow 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .key:hover {
        border-color: rgb(255 255 255 / 19%);
        background-color: rgb(255 255 255 / 7%);
      }

      .key:active,
      .key.pressed {
        transform: scale(0.96);
      }

      .key:focus-visible {
        outline: 2px solid #bdabff;
        outline-offset: 3px;
      }

      .key.utility {
        color: #b8abc4;
        font-size: 14px;
      }

      .key.operator {
        border-color: rgb(177 146 255 / 12%);
        background: linear-gradient(145deg, rgb(151 120 255 / 17%), rgb(128 97 224 / 8%));
        color: #c4b1ff;
        font-size: 22px;
      }

      .key.equals {
        border-color: rgb(255 255 255 / 10%);
        background: linear-gradient(145deg, #b6a0ff, #8d75e6);
        box-shadow: 0 5px 18px rgb(136 106 238 / 24%);
        color: #171321;
        font-size: 23px;
      }

      .key.zero {
        grid-column: span 2;
        text-align: left;
        padding-left: 22px;
      }

      .key.clear {
        font-size: 13px;
        letter-spacing: 0.03em;
      }

      .calculator-foot {
        display: flex;
        justify-content: space-between;
        margin: 17px 3px 1px;
        color: #777589;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      @keyframes drift {
        to {
          transform: translate3d(45px, 25px, 0) scale(1.12);
        }
      }

      @media (max-width: 760px) {
        .shell {
          width: min(100% - 40px, 430px);
          min-height: 100vh;
          min-height: 100svh;
          grid-template-columns: 1fr;
          align-content: center;
          gap: 28px;
          padding: 34px 0;
        }

        .intro {
          padding: 0;
        }

        .eyebrow {
          margin-bottom: 15px;
        }

        h1 {
          font-size: clamp(48px, 12vw, 68px);
        }

        .description {
          max-width: 410px;
          margin-top: 13px;
          font-size: 13px;
        }

        .tip {
          display: none;
        }

        .calculator {
          padding: 18px;
          border-radius: 24px;
        }

        .key {
          height: 54px;
        }
      }

      @media (max-width: 360px) {
        .shell {
          width: min(100% - 28px, 430px);
        }

        .calculator {
          padding: 14px;
        }

        .key {
          height: 50px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A little space to think</p>
        <h1 id="page-title">Clear your<br /><span>headspace.</span></h1>
        <p class="description">
          A calmer place for the numbers. Take a breath, find your rhythm, and let the answer come
          into focus.
        </p>
        <p class="tip"><kbd>ESC</kbd> to reset <span aria-hidden="true">·</span> <kbd>↵</kbd> to calculate</p>
      </section>

      <section class="calculator" aria-label="Immersive calculator">
        <header class="calculator-head">
          <div class="brand"><span class="brand-mark" aria-hidden="true">∑</span> Afterglow</div>
          <span class="online">In focus</span>
        </header>

        <div class="screen" aria-live="polite" aria-atomic="true">
          <span class="screen-label">Your calculation</span>
          <div class="expression" id="expression"></div>
          <output class="display" id="display" aria-label="Display">0</output>
        </div>

        <div class="keys" aria-label="Calculator keys">
          <button class="key utility clear" type="button" data-action="clear" aria-label="All clear">AC</button>
          <button class="key utility" type="button" data-action="sign" aria-label="Change sign">+/−</button>
          <button class="key utility" type="button" data-action="percent" aria-label="Percent">%</button>
          <button class="key operator" type="button" data-operator="/" aria-label="Divide">÷</button>

          <button class="key" type="button" data-digit="7">7</button>
          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key operator" type="button" data-operator="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key operator" type="button" data-operator="-" aria-label="Subtract">−</button>

          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>
          <button class="key operator" type="button" data-operator="+" aria-label="Add">+</button>

          <button class="key zero" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="key equals" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>

        <footer class="calculator-foot">
          <span>Simple math, softer mood</span>
          <span>⌨ Keyboard ready</span>
        </footer>
      </section>
    </main>

    <script>
      const display = document.querySelector("#display");
      const expression = document.querySelector("#expression");
      const keys = document.querySelector(".keys");

      let current = "0";
      let storedValue = null;
      let pendingOperator = null;
      let shouldResetDisplay = false;
      let justCalculated = false;

      const operatorSymbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

      function render() {
        display.textContent = current;
      }

      function formatResult(value) {
        if (!Number.isFinite(value)) return "Error";
        const rounded = Number.parseFloat(value.toPrecision(11));
        return String(Object.is(rounded, -0) ? 0 : rounded);
      }

      function calculate(left, right, operator) {
        switch (operator) {
          case "+": return left + right;
          case "-": return left - right;
          case "*": return left * right;
          case "/": return right === 0 ? NaN : left / right;
          default: return right;
        }
      }

      function inputDigit(digit) {
        if (current === "Error" || shouldResetDisplay || justCalculated) {
          current = digit;
          shouldResetDisplay = false;
          justCalculated = false;
        } else if (current.replace("-", "").replace(".", "").length < 12) {
          current = current === "0" ? digit : current + digit;
        }
        render();
      }

      function chooseOperator(operator) {
        if (current === "Error") return;
        const value = Number(current);

        if (pendingOperator && !shouldResetDisplay) {
          const result = calculate(storedValue, value, pendingOperator);
          current = formatResult(result);
          render();
          storedValue = current === "Error" ? null : Number(current);
        } else {
          storedValue = value;
        }

        pendingOperator = operator;
        shouldResetDisplay = true;
        justCalculated = false;
        expression.textContent = `${current} ${operatorSymbols[operator]}`;
      }

      function equals() {
        if (pendingOperator === null || storedValue === null || current === "Error") return;
        const right = shouldResetDisplay ? storedValue : Number(current);
        const left = storedValue;
        const operator = pendingOperator;

        expression.textContent = `${formatResult(left)} ${operatorSymbols[operator]} ${formatResult(right)} =`;
        current = formatResult(calculate(left, right, operator));
        storedValue = null;
        pendingOperator = null;
        shouldResetDisplay = true;
        justCalculated = true;
        render();
      }

      function clear() {
        current = "0";
        storedValue = null;
        pendingOperator = null;
        shouldResetDisplay = false;
        justCalculated = false;
        expression.textContent = "";
        render();
      }

      function backspace() {
        if (current === "Error" || shouldResetDisplay || justCalculated) {
          current = "0";
          shouldResetDisplay = false;
          justCalculated = false;
        } else {
          current = current.length > 1 ? current.slice(0, -1) : "0";
          if (current === "-") current = "0";
        }
        render();
      }

      function handleAction(action) {
        switch (action) {
          case "clear":
            clear();
            break;
          case "equals":
            equals();
            break;
          case "decimal":
            if (current === "Error" || shouldResetDisplay || justCalculated) {
              current = "0.";
              shouldResetDisplay = false;
              justCalculated = false;
            } else if (!current.includes(".")) {
              current += ".";
            }
            render();
            break;
          case "sign":
            if (current !== "Error" && Number(current) !== 0) {
              current = current.startsWith("-") ? current.slice(1) : `-${current}`;
              render();
            }
            break;
          case "percent":
            if (current !== "Error") {
              current = formatResult(Number(current) / 100);
              shouldResetDisplay = false;
              justCalculated = false;
              render();
            }
            break;
        }
      }

      function pressKey(key) {
        if (/^[0-9]$/.test(key)) inputDigit(key);
        else if (key === ".") handleAction("decimal");
        else if (["+", "-", "*", "/"].includes(key)) chooseOperator(key);
        else if (key === "Enter" || key === "=") equals();
        else if (key === "Escape") clear();
        else if (key === "Backspace") backspace();
        else if (key === "%") handleAction("percent");
      }

      keys.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        if (button.dataset.digit !== undefined) inputDigit(button.dataset.digit);
        else if (button.dataset.operator) chooseOperator(button.dataset.operator);
        else if (button.dataset.action) handleAction(button.dataset.action);
      });

      document.addEventListener("keydown", (event) => {
        if (["Enter", "=", "Escape", "Backspace", "%", ".", "+", "-", "*", "/"].includes(event.key) || /^[0-9]$/.test(event.key)) {
          event.preventDefault();
          pressKey(event.key);
        }
      });
    </script>
  </body>
</html>
